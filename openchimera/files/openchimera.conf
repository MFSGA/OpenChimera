# OpenChimera UCI configuration
# Milestone 1 - minimal runtime schema
# See /etc/config/openchimera on the target device after package installation.

config status 'status'

config config 'config'
	option enabled '0'
	option log_level 'warning'
	option log_file '/var/log/openchimera/core.log'

config core 'core'

config mixin 'mixin'
	option mixed_port '7890'
	option socks_port '1080'
	option port '8080'
	option api_listen '[::]:9090'
	option secret ''
	option tun_enabled '0'
	option tun_device 'nikki'
	option tun_dns_hijack '0'

config proxy 'proxy'
	option enabled '1'

config routing 'routing'
	option tun_route_table '81'
